[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sophonic"
version = "0.2.0"
description = "Auth helpers for the Sophonic Claude Code plugin (Google, Slack, Zoom, GitLab)"
readme = "README.md"
requires-python = ">=3.12"
# Only the irreducible, auth-bound integrations remain as code. Claude Code itself
# provides the LLM loop, tool dispatch, and conversational surface — so anthropic,
# openai, mcp, typer, and rich are gone.
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "dateparser>=1.2.0",
    "google-api-python-client>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "google-auth-httplib2>=0.2.0",
    "playwright>=1.50.0",
    "cryptography>=42.0.0",
    "tomli-w>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "freezegun>=1.4.0",
]

# Thin, optional terminal wrappers for the run-in-terminal utilities. The plugin itself
# needs none of these (skills call scripts/*.py over Bash); they exist only so terminal
# users can type `sophonic-config …` instead of `uv run python scripts/config.py …`.
[project.scripts]
sophonic-config = "sophonic.configcli:main"
sophonic-doctor = "sophonic.doctorcli:main"
sophonic-auth = "sophonic.authcli:main"

[tool.hatch.build.targets.wheel]
packages = ["sophonic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
